# 주간 자동 — 계절성·MDD(종목 프로파일) 증분 갱신 (PC 불필요)
#
# 동작:
#   1) data/longcache(장기 종가)를 GitHub Actions 캐시에서 복원
#   2) screen_precompute.py 증분 실행 — 새로 생긴 날짜만 받아 append
#   3) results/seasonality.json·mdd.json 커밋 → Streamlit 자동 반영
#   4) longcache를 다시 캐시에 저장 (다음 주에 복원)
#
# 첫 1~2회는 longcache가 비어 있어 2008~ 전체를 받느라 느릴 수 있고,
# 타임아웃이 나도 받은 만큼 캐시에 저장돼 다음 주에 이어받아 자가치유됨.
# 주간(7일 내) 실행이라 Actions 캐시(7일 미사용 시 만료)가 항상 살아있음.
name: weekly-profile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 0'      # 일 22:00 UTC = 월 07:00 KST (주 1회)

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: 장기 종가 캐시 복원/저장 (증분 핵심)
        uses: actions/cache@v4
        with:
          path: data/longcache
          key: longcache-${{ github.run_id }}
          restore-keys: |
            longcache-

      # ⚠️ 2026-09-07 신설 — 이게 없어서 매주 SEC 를 3,095종 처음부터 받고 있었다.
      #   fetch_shares 는 data/shares_cache 의 **파일 나이**로 캐시를 판정하는데,
      #   그 디렉토리는 .gitignore 라 러너에 존재하지 않는다. 늘 캐시 미스가 나서
      #   STALE_DAYS=20 이 아무 역할도 못 했다. 실측 1시간 이상(원래 4분).
      #   같은 함정을 data/leaders_cache 도 갖고 있었다(그쪽은 아예 죽었다).
      - name: SEC 주식수 캐시 복원/저장 (없으면 매주 3천종을 새로 받는다)
        uses: actions/cache@v4
        with:
          path: data/shares_cache
          key: shares-cache-${{ github.run_id }}
          restore-keys: |
            shares-cache-

      # SEC 공시 주식수 갱신. 분기 공시라 주 1회면 충분하고, 매일은 daily-refresh 가
      # 주가만 다시 곱한다. frames = 분기당 1콜로 5천개사, shares = 빈칸 메우기.
      - name: 미국 주식수 갱신 (SEC)
        run: |
          python marketcap_refresh.py frames
          python marketcap_refresh.py shares
          python marketcap_refresh.py build --net-price
        continue-on-error: true

      - name: 기간수익률·계절성·MDD 증분 갱신
        run: python screen_precompute.py
        continue-on-error: true

      # 주도주 KR — 지금까지 어느 워크플로에도 없어 손으로만 돌렸고, 그래서 대시보드
      # 🇰🇷 탭이 US(자동)보다 며칠씩 묵은 신호를 띄우고 있었다.
      # 여기 붙이는 이유: 위 캐시 스텝이 이미 data/longcache 를 복원해 두므로,
      # KR 가격 이력이 러너에 그대로 있다. 별도 워크플로를 만들면 139MB 캐시를
      # 한 벌 더 굴려야 한다.
      # market.db(574MB, gitignore)는 러너에 없다 — 분기재무·universe 는
      # export_kr_fundq.py 가 만든 커밋된 parquet(0.71MB + 79KB)로 폴백한다.
      - name: 주도주 KR 신호 갱신 (KR-P1 · KR-U6 · 포워드 원장)
        run: |
          # ⚠️ 예전엔 세 줄을 그냥 이어 썼다. bash -e 라 앞이 죽으면 뒤는 **실행조차
          #    안 된다.** 실측(2026-09-09): leaders_kr.json 은 러너가 갱신하는데
          #    leaders_kr6.json 은 08-31, leaders_kr_paper.json 은 08-22 이후로
          #    github-actions 가 한 번도 건드린 적이 없었다 — 2번에서 죽어 3번이
          #    19일간 한 번도 못 돈 것이다. 원장이 멈춘 진짜 이유가 이 한 줄이었다.
          # ⚠️ 그리고 continue-on-error 가 에러를 통째로 삼켜, 무엇 때문에 죽는지
          #    20일 가까이 알 수 없었다. 각 스텝을 독립 실행하고 실패한 것만 로그
          #    꼬리를 파일에 남긴다 — 그 파일은 커밋되고 정지 알림에 실려 폰으로 온다.
          mkdir -p results
          : > results/kr_step_errors.txt
          run_step () {
            echo "── $1.py $2"
            if python "$1.py" "$2" > "$1.log" 2>&1; then
              tail -3 "$1.log"
            else
              echo "  ❌ 실패 (exit $?)"
              { echo "[$1.py $2] 실패:"; tail -15 "$1.log"; echo; } >> results/kr_step_errors.txt
              tail -15 "$1.log"
            fi
          }
          run_step leaders_kr publish
          run_step leaders_kr6 publish
          run_step leaders_kr_paper update
        continue-on-error: true

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          # returns.json 누락이 2026-06→07, 07→08 두 번 연속 18일 정지를 만들었다.
          # screen_precompute 가 만드는 3개를 전부 커밋한다.
          git add results/returns.json results/seasonality.json results/mdd.json 2>/dev/null || true
          git add data/us_shares.csv data/us_marketcap.csv data/us_splits.csv 2>/dev/null || true
          # ⚠️ 경로를 한 줄에 여러 개 넘기면 하나만 없어도 git add 가 fatal 로 죽으면서
          #    *아무것도* 스테이징하지 않는다. 하나씩 넘긴다.
          for f in results/leaders_kr.json results/leaders_kr6.json \
                   results/leaders_kr_paper.json results/kr_step_errors.txt; do
            [ -f "$f" ] && git add "$f"
          done
          # ⚠️ 2026-09-08 — pull 이 없어서 두 번 연속 푸시가 거부됐다.
          #   ! [rejected] main -> main (fetch first)
          #   이 워크플로는 1시간 40분 넘게 돈다. 그동안 사람이나 daily-refresh 가
          #   한 번이라도 푸시하면 러너의 로컬이 뒤처져 무조건 실패한다.
          #   작업은 다 끝내놓고 마지막 한 줄에서 통째로 버리는 셈이라, 화면에서는
          #   "KR 원장이 17일째 안 갱신됨"으로만 보였다.
          #   daily-refresh 는 원래 pull --rebase 를 하고 있었다 — 여기만 빠져 있었다.
          # ── 푸시는 실패해도 재시도한다 ────────────────────────────────
          # 2026-09-06 실측: 1시간 47분 돌려 산출물을 다 만들어놓고 마지막 push 가
          # rejected 되어 **통째로 버렸다**. pull --rebase 를 넣어도 pull 과 push
          # 사이 몇 초의 경주 구간은 남는다 — 좁아질 뿐 닫히지 않는다.
          # 그리고 push 종료코드만 믿지 않고 origin 이 실제로 따라왔는지 확인한다.
          #
          # ⚠️ 잡이 빨간불이 되는 것만으로는 부족하다. 실제로 이때 잡은 실패했지만
          #    아무도 GitHub 메일을 안 읽어서, 화면에는 "KR 원장 17일 정지" 로만
          #    보였다. 읽는 채널(텔레그램)로 보내야 조치가 일어난다.
          push_with_retry () {
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                git fetch -q origin main
                if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
                  echo "  푸시 반영 확인"
                  return 0
                fi
                echo "  push 는 성공했다는데 origin 이 안 따라왔다 — 재시도 $i/3"
              else
                echo "  푸시 거부 — rebase 후 재시도 $i/3"
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "::error::푸시 3회 재시도 실패 — 이번 실행 산출물이 통째로 버려졌다"
            python - <<'PY' || true
          import os
          try:
              import config
              from telegram_notifier import send_message
              if config.TELEGRAM_ENABLED:
                  send_message(config.TELEGRAM_TOKEN, config.TELEGRAM_CHAT_ID,
                               "🚨 [screener] %s 푸시 3회 실패 — 이번 실행 산출물이 버려졌다\n"
                               "작업은 다 끝났는데 origin 에 반영을 못 했다. "
                               "다음 실행까지 화면 데이터가 그대로 멈춘다."
                               % os.environ.get("GITHUB_WORKFLOW", "workflow"))
          except Exception as e:
              print("텔레그램 발송 실패:", e)
          PY
            return 1
          }
          git diff --staged --quiet || {
            git commit -m "auto: 종목 프로파일 갱신 $(date -u +%Y-%m-%d)"
            push_with_retry
          }

      # continue-on-error 로 스텝이 죽어도 초록불이라 그대로 묻힌다.
      # 커밋 뒤 신선도를 직접 확인해, 정지면 텔레그램 경보 + 잡을 실패로 표시한다.
      - name: 신선도 검증 (정지면 실패 처리)
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python pipeline_health.py
          python - <<'PY'
          import sys
          from data_freshness import statuses
          bad = [r for r in statuses()
                 if r['job'] == 'weekly-profile' and r['state'] != 'ok']
          for r in bad:
              print(f"::error::{r['label']} — {r['note']} (마지막 {r['date']})")
          sys.exit(1 if bad else 0)
          PY
