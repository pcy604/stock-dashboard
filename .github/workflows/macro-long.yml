# 매크로 장기 시계열 수집 — 평일 매일 · 수동 실행 또는 macro-* 브랜치에서 수집 스크립트가 바뀔 때
name: macro-long

on:
  workflow_dispatch:
  schedule:
    - cron: '53 22 * * 0-4'     # 월~금 07:53 KST — 4계절 v2(macro_season)·당일 경보 폴백이 이 파일을 쓴다(2026-11-06 매일로)
  push:
    branches: ['macro-*']
    paths: ['tools/fetch_macro_long.py', '.github/workflows/macro-long.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRED_KEY: ${{ secrets.FRED_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests yfinance
      - run: python tools/fetch_macro_long.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f data/research/macro_long_fred.parquet data/research/macro_long_px.parquet
          git commit -m "auto: 매크로 장기 시계열 $(date -u +%F)" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"

      # 2026-11-22 감시 커버리지 — 이 산출물에는 CI 감시자가 없었다(화면엔 빨간불, CI 는 초록불).
      #   `tools/check_freshness_ci.py --audit` 가 공백을 세며, 새 산출물을 등록하면 거기서 걸린다.
      - name: 산출물 신선도 검증
        if: always()
        run: python tools/check_freshness_ci.py --job macro-long
