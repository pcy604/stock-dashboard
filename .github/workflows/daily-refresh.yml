# 매일 자동으로 데이터 생성 → 커밋 → Streamlit Cloud 자동 반영 (PC 불필요)
#
# 활성화 전 GitHub repo → Settings → Secrets and variables → Actions 에 등록:
#   FRED_KEY  (필수),  TELEGRAM_TOKEN · TELEGRAM_CHAT_ID (선택, 매도 알림용)
#
# 가벼운 라이브 갱신(주봉·월간·CANSLIM·섹터)은 매일.
# 무거운 캐시 기반(계절성·MDD)은 가격캐시가 repo에 없어 Actions에서 제외 →
# 로컬에서 가끔 `python screen_precompute.py`로 갱신.
name: daily-refresh

on:
  workflow_dispatch:          # 수동 실행 버튼
  schedule:
    - cron: '0 21 * * 0-4'    # UTC 21시 = 한국 06시, 월~금(장 마감 후)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FRED_KEY: ${{ secrets.FRED_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # ⚠️ 2026-09-07 신설 — 이 워크플로에는 캐시가 하나도 없었다.
      #   data/leaders_cache(가격)와 data/shares_cache(SEC 주식수)는 .gitignore 라
      #   러너에 존재하지 않는다. 그래서 marketcap_refresh 가 매번 처음부터 받았고,
      #   universe_syms 는 아예 FileNotFoundError 로 죽었다(19일간 조용히).
      #   캐시가 있으면 증분으로 끝나고, 복원에 실패해도 지금과 똑같이 동작한다.
      - name: SEC 주식수 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: data/shares_cache
          key: shares-cache-${{ github.run_id }}
          restore-keys: |
            shares-cache-

      # 843MB 라 복원이 가볍진 않지만, 3,095종을 네트워크로 다시 받는 것보다 빠르다.
      # 이게 채워져 있으면 marketcap_refresh 의 MAX_FETCH(하루 600종) 구간이 비어서
      # 그냥 지나간다.
      - name: 주봉 가격 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: data/leaders_cache
          key: leaders-cache-${{ github.run_id }}
          restore-keys: |
            leaders-cache-

      # ⚠️ 이 단계가 맨 앞이어야 한다. 아래 스크리너들이 전부 us_marketcap.csv 로
      #    유니버스를 거른다. 2026-08-18 까지 이 파일은 2024-04 에 손으로 받은
      #    스냅샷이었고 27개월간 갱신되지 않았다 — 종목의 72%가 틀린 시총으로
      #    필터링되고 있었다(AXTI $151M 로 표시, 실제 $5.4B).
      #    주식수(us_shares.csv)는 커밋돼 있고 분기에만 바뀌므로, 매일은 주가만
      #    다시 곱하면 된다. 주식수 자체 갱신은 weekly-profile 에서 한다.
      - name: 미국 시총 갱신 (주식수 × 당일 종가)
        run: python marketcap_refresh.py build --net-price
        continue-on-error: true

      - name: 섹터 맵 갱신
        run: python sectors.py
        continue-on-error: true

      - name: 주봉 스크리너 + 페이퍼 트레이딩 자동기록
        run: python weekly_run.py
        continue-on-error: true

      - name: 월간 성과 갱신
        run: python perf_run.py
        continue-on-error: true

      - name: CANSLIM 갱신
        run: python canslim_run.py
        continue-on-error: true

      # 2026-08-08 제거: leaders_run.py는 results/leaders_v2.json을 만들지만 소비자가 없다.
      # 08-05에 대시보드 🚀주도주 탭이 leaders_signal.json(규칙⑤)으로 교체됨.
      # 이 스크립트의 핵심 조건(52주 신고가 -25% 이내 · 영업이익 YoY +100%)은
      # 유니버스 검증에서 기각된 조건이라 결과를 되살리면 안 됨. 코드는 leaders_run.py에 보존.

      - name: US CANSLIM
        run: python canslim_us_run.py
        continue-on-error: true

      - name: DART 재무 적재(시총 상위) → 가치 스냅샷
        run: |
          python ingest_dart.py --top 250 --years 2
          python value_export.py
        continue-on-error: true

      - name: 컨센서스 시계열 스냅샷 (월요일만 — 리비전 모멘텀 재료)
        run: |
          if [ "$(date -u +%u)" = "1" ]; then python consensus_snapshot.py; else echo "월요일 아님 — 스킵"; fi
        continue-on-error: true

      - name: 파이프라인 신선도 검사 (정지 시 텔레그램 경보)
        run: python pipeline_health.py
        continue-on-error: true

      - name: 변경분 커밋 & 푸시
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          # ⚠️ 경로를 한 줄에 몰면 안 됨: git add는 pathspec 하나라도 없으면 전체가 실패
          #    (data/portfolio.json 부재로 한 달간 아무것도 커밋 안 된 사고의 원인)
          git add results/*.json || true
          # 2026-10-03 — .jsonl 은 위 glob 에 전혀 안 걸린다.
          #   consensus_history.jsonl 은 매주 월요일 누적되는데 캤밋이 안 돼서
          #   쓰고 버려지길 반복했다 — 시드 캤밋 1건이 전부였다.
          #   16주 시계열이 필요한 리버전 모멘텀이 1주차에서 멈춘 원인이다.
          git add results/*.jsonl 2>/dev/null || true
          git add data/sectors.json || true
          git add data/us_marketcap.csv || true
          git add data/portfolio.json 2>/dev/null || true
          # 2026-10-03 — 이 세 개가 빠지게 해서 17일간 산출물이 매일 통째로 비렸다.
          #   marketcap_refresh.py 는 us_marketcap.csv 만 쓰는 게 아니다:
          #   us_shares.csv(576행) · us_splits.csv(277행) · us_domicile.csv(353행) 도 쓴다.
          #   us_shares.csv 는 as_of 에 오늘 날짜가 기록되므로 **매일 반드시 내용이 바뀐다**.
          #   weekly-profile.yml 은 이미 세 개를 다 add 하고 있었다 — 같은 파일을
          #   쓰는데 add 목록이 한쿽에만 있었다.
          git add data/us_shares.csv 2>/dev/null || true
          git add data/us_splits.csv 2>/dev/null || true
          git add data/us_domicile.csv 2>/dev/null || true
          # 구루 워크플로가 실행 중(수십 분) 푸시할 수 있으므로 rebase 후 푸시 (레이스 방지)
          # ── 푸시는 실패해도 재시도한다 ────────────────────────────────
          # 2026-09-06 실측: 1시간 47분 돌려 산출물을 다 만들어놓고 마지막 push 가
          # rejected 되어 **통째로 버렸다**. pull --rebase 를 넣어도 pull 과 push
          # 사이 몇 초의 경주 구간은 남는다 — 좁아질 뿐 닫히지 않는다.
          # 그리고 push 종료코드만 믿지 않고 origin 이 실제로 따라왔는지 확인한다.
          #
          # ⚠️ 잡이 빨간불이 되는 것만으로는 부족하다. 실제로 이때 잡은 실패했지만
          #    아무도 GitHub 메일을 안 읽어서, 화면에는 "KR 원장 17일 정지" 로만
          #    보였다. 읽는 채널(텔레그램)로 보내야 조치가 일어난다.
          push_with_retry () {
            # 2026-10-03 — 17일간 매일 실패한 원인은 push 가 아니라 **pull** 이었다.
            #   추적 파일에 unstaged 변경이 남은 상황에서 pull --rebase 를 부르면
            #   git 이 거부한다: "cannot pull with rebase: You have unstaged changes."
            #   그러면 `pull && push` 의 AND 로 push 는 시도조차 안 되고,
            #   재시도 3회가 전부 같은 자리에서 죽는다 — 재시도가 무의미해진다.
            #   (09-10 이전은 `pull ; push` 라 pull 이 거부도도 push 는 그냥 실행되었다.
            #    푸시를 튼튼하게 만든 수정이 푸시를 완전히 마가버렸다.)
            #   파일 하나를 add 목록에 더 적는 것만으로는 같은 사고가 네 번째로 난다.
            #   캤밋 대상이 아닌 변경은 구조적으로 치우고, 무엇이 빠졌는지는
            #   로그에 남긴다 — 다음에 add 목록에 올릴 후보로 보이게.
            if ! git diff --quiet; then
              echo "⚠️ 추적 파일에 미사용 변경이 남아 pull 을 막는다 — 치운다:"
              git diff --name-only | sed 's/^/     /'
              git stash push -q -m "ci-residue $(date -u +%F)" || git checkout -- .
            fi
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                git fetch -q origin main
                if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
                  echo "  푸시 반영 확인"
                  return 0
                fi
                echo "  push 는 성공했다는데 origin 이 안 따라왔다 — 재시도 $i/3"
              else
                echo "  푸시 거부 — rebase 후 재시도 $i/3"
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "::error::푸시 3회 재시도 실패 — 이번 실행 산출물이 통째로 버려졌다"
            python - <<'PY' || true
          import os
          try:
              import config
              from telegram_notifier import send_message
              if config.TELEGRAM_ENABLED:
                  send_message(config.TELEGRAM_TOKEN, config.TELEGRAM_CHAT_ID,
                               "🚨 [screener] %s 푸시 3회 실패 — 이번 실행 산출물이 버려졌다\n"
                               "작업은 다 끝났는데 origin 에 반영을 못 했다. "
                               "다음 실행까지 화면 데이터가 그대로 멈춘다."
                               % os.environ.get("GITHUB_WORKFLOW", "workflow"))
          except Exception as e:
              print("텔레그램 발송 실패:", e)
          PY
            return 1
          }
          git diff --staged --quiet || {
            git commit -m "auto: 데이터 갱신 $(date -u +%Y-%m-%d)"
            push_with_retry
          }

      # 2026-09-07 신설 — 위 단계는 전부 continue-on-error 라 하나가 죽어도 초록불로
      # 끝난다. 실제로 미국 시총이 08-18 부터 19일간 멈췄는데 아무도 몰랐다.
      # 여기서 산출물의 실제 날짜를 검사해 낡았으면 실패시킨다. 실패하면 메일이 온다.
      - name: 산출물 신선도 검증 (조용한 고장 차단)
        run: python tools/check_freshness_ci.py

      # 2026-10-03 신설 — 감시견 3개가 전부 않도록 채 17일이 갔다.
      #   · pipeline_health 는 캤밋 **앞**에서 러너 로얼 파일을 본다. 방금 만든
      #     파일이니 늘 신선하다 → 푸시 실패를 원리적으로 보지 못한다.
      #   · check_freshness_ci 는 캤밋 **뒤** 스텝이다. 캤밋이 exit 1 이면
      #     스킵된다 → 조용한 고장 차단기가 조용한 고장 날 돌지 않는다.
      #   · push_with_retry 속 텔레그램은 함수 속 heredoc 이라 깨지면
      #     `|| true` 가 삼킨다(실제로 로그에 발속 흔적이 한 줄도 없었다).
      #   이 스텝은 잡이 **어떤 스텝에서 어떻게 죽어도** 돌고, 산출물 날짜가
      #   아니라 "잡이 실패했다"는 사실만 보내 위 세 구먹에 걸리지 않는다.
      - name: 실패 시 텔레그램 (잡이 어떤 스텝에서 죽어도 울린다)
        if: failure()
        run: python tools/notify_ci_failure.py
        continue-on-error: true
