# 실전 시범 — 다음 주 매매 계획표 (live/plan.py · 규칙 live/PREREG_2026-11.md)
# 매주 토요일(주봉 마감 + research-ratchet 지수 갱신 뒤) 계획을 만들어 텔레그램으로 보내고 live/plan_latest.* 를 커밋한다.
# 주문은 하지 않는다 — 계획표만. (토스 주문 봇은 별도 · 실전 스위치는 차니가 켠다)
name: live-plan
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 6'          # 토 18:23 KST
  push:
    branches: [main]
    paths:
      - 'live/plan.py'
      - '.github/workflows/live-plan.yml'
permissions:
  contents: write
concurrency:
  group: live-plan
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 계획표 만들기 · 텔레그램
        run: python live/plan.py --send
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add live/plan_latest.json live/plan_latest.md live/rs_snap.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "auto: 실전 시범 다음 주 계획 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
