# 종목 분석 실데이터 검증 (2026-10-21) — verify-* 브랜치에 푸시하면 러너가 DART·SEC·yfinance 실응답 점검 + 화면 캡처를 하고
# 결과를 같은 브랜치에 커밋한다. Claude 작업 환경은 외부 접속이 막혀 있어 이 결과로 확인한다. main 은 건드리지 않는다.
name: verify-analysis
on:
  workflow_dispatch:
  push:
    branches: ['verify-*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DART_KEY: ${{ secrets.DART_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt playwright && python -m playwright install --with-deps chromium
      - name: 데이터 실응답 점검
        run: python tools/verify_analysis.py
        continue-on-error: true
      - name: 화면 캡처
        run: |
          nohup streamlit run dashboard.py --server.headless true --server.port 8501 > st.log 2>&1 &
          sleep 20
          python tools/ui_snap_stock.py 006110 TSLA || true
          tail -80 st.log > results/verify/st_log.txt || true
        continue-on-error: true
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f results/verify data/research/ui/stock_*.png 2>/dev/null || true
          git commit -m "auto: 종목 분석 실데이터 검증 $(date -u +%F' '%H:%M)" || exit 0
          # 검증 브랜치는 이 잡만 쓴다 — pull 하지 않는다(실행 중 바뀐 다른 파일 때문에 rebase 가 exit 128 로 죽었다, 2026-10-21)
          git push origin "HEAD:${GITHUB_REF_NAME}"
