# 국가별 주식시장 시가총액(세계은행 연간) — 월 1회 + 수동 + macro-* 브랜치에서 스크립트가 바뀔 때
name: world-mcap

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 2 * *'
  push:
    branches: ['macro-*']
    paths: ['tools/fetch_world_mcap.py', '.github/workflows/world-mcap.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/fetch_world_mcap.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/world_mcap.json
          git commit -m "auto: 국가별 시총(세계은행) $(date -u +%F)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
