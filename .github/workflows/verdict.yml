# 이번 주 판정만 다시 계산 — 수동 실행(2026-10-21). 평소에는 daily-refresh 가 06:00 에 같은 스크립트를 돌린다.
#   verdict.py → results/macro.json (코어 200일선 스위치 · 목표 비중 · 참고 국면·경고). 화면·리포트·executor 공용.
name: verdict
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_KEY: ${{ secrets.FRED_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 이번 주 판정
        run: python verdict.py
      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add results/macro.json
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "auto: 이번 주 판정 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
