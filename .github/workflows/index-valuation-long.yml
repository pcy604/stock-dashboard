# 지수 밸류에이션 장기판 (2026-11-28) — tools/index_valuation_long.py
# 한국거래소(pykrx)·multpl 은 작업 세션에서 막혀 CI 에서 받는다. 매주 토요일 + 수동.
name: index-valuation-long
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 6'      # 토 14:23 KST
  push:
    branches: [main]
    paths: ['tools/index_valuation_long.py', '.github/workflows/index-valuation-long.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python tools/index_valuation_long.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/index_valuation_long.json
          git diff --cached --quiet && exit 0
          git commit -m "auto: 지수 밸류에이션 장기판 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && break; sleep 5; done
