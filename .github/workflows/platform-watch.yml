# 🛰️ 플랫폼 상시 감시 (2026-11-22) — tools/platform_watch.py
#   L1 매일      : 플랫폼이 살아 있나 · 우리 자격(키·UA)이 아직 통하나
#   L2 주 1회(월): 약관·한도·요금 문서의 바뀐 줄 — 한도·요금·금지 관련 말이 섞였을 때만 울린다
#   L3 분기(1·4·7·10월 1일): 재평가 틀을 docs/research/ 에 만든다 (판단은 사람이 적는다)
#
# 왜 분리했나: 산출물 신선도(check_freshness_ci)는 **우리 파이프라인**을 본다. 이건 **남의 땅**을 본다.
#   요금제·한도·약관이 바뀌면 우리 코드는 그대로인데 제품이 멈추고, 그 변화는 산출물이 낡기
#   전에 문서에서 먼저 보인다.
name: platform-watch
on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'       # 매일 UTC 21:20 → KST 06:20 (L1)
    - cron: '40 21 * * 1'       # 월요일 → L2 도 같이
    - cron: '0 22 1 1,4,7,10 *' # 분기 첫날 → L3
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_CONTACT:    ${{ secrets.SEC_CONTACT }}
      DART_KEY:       ${{ secrets.DART_KEY }}
      FRED_KEY:       ${{ secrets.FRED_KEY }}
      GEMINI_KEY:     ${{ secrets.GEMINI_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pandas pyarrow         # data_freshness(간접 판정)가 쓴다

      # L1 은 매번. 연속 3회 실패 또는 '자격 거부'면 exit 1 → 메일이 온다.
      #   ⚠️ 먼저 돌리고 커밋을 **뒤에** 둔다. 그리고 커밋 스텝은 always() 다 —
      #      감시자가 울린 날에 그 기록이 저장되지 않으면 streak 가 누적되지 않아
      #      다음 날 다시 1회부터 센다(경보가 영원히 안 온다).
      - name: L1 — 플랫폼 상태
        id: l1
        run: python tools/platform_watch.py --l1

      - name: L2 — 규정 문서 diff (월요일·수동)
        if: always() && (github.event.schedule == '40 21 * * 1' || github.event_name == 'workflow_dispatch')
        run: python tools/platform_watch.py --l2

      - name: L3 — 분기 재평가 틀 (분기 첫날·수동)
        if: always() && (github.event.schedule == '0 22 1 1,4,7,10 *' || github.event_name == 'workflow_dispatch')
        run: python tools/platform_watch.py --l3

      - name: 기록 커밋 (경보가 울린 날에도 반드시)
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          for f in results/platform_status.json results/platform_docs.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          git add -f docs/research/*_플랫폼_재평가.md 2>/dev/null || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "auto: 플랫폼 감시 $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::push 3회 실패"; exit 1
