# 주도주(이익 가속) 주간 편입 후보 — PC 불필요
#
# 왜 신설했나 (2026-09-14)
#   이 규칙만 Actions 밖에 있었다. leaders_weekly.sh 가 PC의 작업 스케줄러로만
#   돌았고, 09-05 토요일에 PC가 꺼져 있어 Windows 가 주간 작업을 건너뛰었다.
#   Windows 는 놓친 주간 작업을 다음 주까지 다시 잡지 않는다 — DB가 08-24 에
#   2주간 멈춰 있었고 아무도 몰랐다. PC 의존을 끊는 것이 목적이다.
#
#   market.db(gitignore)는 러너에 없지만 .gitignore 가 "재생성 가능"이라 적어 둔
#   그대로다 — leaders_build.py update 가 data/leaders_cache 로부터 증분 적재한다.
#
# 산출물 스크립트를 파일로 안 쪼갠 이유
#   파일 두 개를 웹에서 각각 올리다 두 번 어긋났다(260914 사고). 한 파일로 둔다.
#
# 필요 시크릿: 없다. leaders_build.py 는 Yahoo(주가)·SEC EDGAR(재무)만 쓴다.
#
# 편입 규칙 — leaders_accel.py 게이트 그대로, 시가총액 오름차순
# 청산은 여기서 다루지 않는다. 2026-09-13 확정 규칙은
#   손절 = 고점 대비 −20%(진입가 대비가 아니다), 익절 = 52주 최소보유 후
#   진입 후 최고가 33주 미갱신 시 매도. leaders_accel_take.py 소관.
name: weekly-accel

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: '이력 결손 종목(52주 미만) 전 기간 재적재 — 수 시간 걸린다'
        type: boolean
        default: false
  schedule:
    # 미국 마감 16:00 ET = 20:00 UTC(서머타임) / 21:00 UTC(표준시).
    # 22:17 UTC 면 연중 한 시각으로 양쪽을 덮는다. 토 07:17 KST.
    # :00 을 피한 이유 — Actions 예약은 정시에 몰려 수십 분씩 밀린다.
    - cron: '17 22 * * 5'
    # 예비. 금요일 실행이 밀렸을 때만 일한다. 토 15:17 KST.
    - cron: '17 6 * * 6'

permissions:
  contents: write
  actions: read      # 실패 알림이 실패 스텝·원인을 읽는다(2026-10-19)
  checks: read

concurrency:
  group: leaders-cache
  cancel-in-progress: false

jobs:
  accel:
    runs-on: ubuntu-latest
    # backfill 은 1,700종 전 기간 재계산이라 길다(2026-10-19). 평시는 50분.
    timeout-minutes: ${{ inputs.backfill && 340 || 50 }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
      # 2026-10-14 — 실패를 알리려고 추가(아래 '유니버스 붕괴 차단'·'실패 시 텔레그램')
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 얕은 clone 에서는 pull --rebase 가 깨질 수 있다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # daily-refresh 와 같은 prefix. fq_(분기재무)·ek_(실적일)가 살아 있어야
      # 5분이 30분이 되지 않는다.
      # ⚠️ 2026-10-19 — actions/cache@v4 는 **잡이 성공해야만** 저장한다. 10-14 부터
      #   산출물 계약 단계가 매번 잡을 실패시켜 market.db 가 한 번도 저장되지 않았다.
      #   매주 10-10 캐시로 되돌아가 같은 고장을 되풀이했다. 복원/저장을 나누고
      #   저장은 always() 로 건다(맨 아래 '캐시 저장').
      - name: 주봉 가격·재무 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: data/leaders_cache
          key: leaders-cache-${{ github.run_id }}
          restore-keys: |
            leaders-cache-

      - name: market.db 복원
        uses: actions/cache/restore@v4
        with:
          path: data/market.db
          key: marketdb-${{ github.run_id }}
          restore-keys: |
            marketdb-

      # 금요일 실행이 성공했으면 토요일 예비 실행은 여기서 끝낸다.
      - name: 이번 주 이미 처리됐는지 확인
        id: due
        run: |
          FRI=$(python -c "import datetime as dt; t=dt.datetime.utcnow().date(); print(t - dt.timedelta(days=(t.weekday()-4)%7))")
          DONE=$(python -c "import json,os; p='results/accel_picks_status.json'; print(json.load(open(p)).get('exported_week','') if os.path.exists(p) else '')")
          echo "직전 금요일 $FRI / 마지막 산출 ${DONE:-없음}"
          if [ "${{ inputs.backfill }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "backfill 요청 — 주차 중복 검사를 건너뛴다."
          elif [ -n "$DONE" ] && [ ! "$DONE" \< "$FRI" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "[SKIP] 이번 주차는 이미 산출됐다 - 예비 실행을 건너뛴다."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 캐시 상태 확인
        if: steps.due.outputs.skip != 'true'
        run: |
          echo "leaders_cache: $(ls data/leaders_cache 2>/dev/null | wc -l) 파일"
          if [ -f data/market.db ]; then
            echo "market.db: $(du -h data/market.db | cut -f1)"
            python -c "import sqlite3;c=sqlite3.connect('data/market.db');print('factor_weekly max as_of =',c.execute('select max(as_of) from factor_weekly').fetchone()[0])"
          else
            echo "market.db 없음 - 이번 실행에서 새로 쌓는다 (첫 회는 느리다)"
          fi

      # continue-on-error 를 안 붙인다. 붙이면 낡은 DB 로 후보를 뽑고 성공한 척
      # 끝난다 — 이번에 고치려는 고장이 정확히 그 모양이었다.
      #
      # ⚠️ 2026-10-10 — 여기에 `rm -f px_*.csv dy_*.csv` 가 있었다. 매주 캐시를
      #   통째로 지우고 2,900종을 Yahoo 에서 다시 받았다. 이유("수정주가가 소급
      #   변경되므로 증분은 과거를 어긋낸다")는 옳았지만 Yahoo 가 그걸 못 버텼다:
      #   실측 ~300종에서 끊겨 universe 가 2,429 → 242종으로 무너졌고, 이익 가속
      #   신호가 09-14 이후 0종이 됐다. 화면은 한 달째 09-07 에 멈춰 있었다.
      #   **신호가 없었던 게 아니라 볼 종목이 없었다.**
      #
      #   이제 market.db(prices)에 종목별 마지막 주차를 물어 없는 구간만 받는다.
      #   소급 변경은 두 겹으로 막는다:
      #     · 분할 종목 — leaders_build.recent_split_syms() 가 잡아 전수 재수집
      #     · 배당 소급분 — 실측 0.15%/회라 주 단위에선 무시 가능. 다만 누적되므로
      #       분기 첫 주에 --full 로 전체를 다시 받아 기준을 맞춘다.
      - name: 가격 캐시 갱신 (증분 · 분기 첫 주는 전수)
        if: steps.due.outputs.skip != 'true'
        run: |
          M=$(date -u +%-m); D=$(date -u +%-d); FULL=""
          if [ "$D" -le 7 ] && { [ "$M" = 1 ] || [ "$M" = 4 ] || [ "$M" = 7 ] || [ "$M" = 10 ]; }; then
            FULL="--full"
            echo "분기 첫 주 — 전수 재수집(--full)"
          fi
          python leaders_build.py fetch 2900 $FULL

      - name: factor_weekly 증분 적재
        if: steps.due.outputs.skip != 'true'
        run: python leaders_build.py update

      # 2026-10-19 — 캐시 market.db 에 243종 이력만 남아 있던 고장의 복구 경로.
      #   이력 52주 미만 종목을 지우고 2018년부터 다시 계산한다.
      - name: 이력 결손 재적재 (backfill)
        if: steps.due.outputs.skip != 'true' && inputs.backfill
        run: python leaders_build.py newsyms

      # 2026-10-19 — 시총이 빈 행 복구. us_shares.csv 가 쪼그라든 날 쌓인 이력은 marcap 이
      #   전 기간 NULL 이라 '시총 $0.3B+' 에서 통째로 탈락했다(NVDA·AXTI·PLTR 등 461종).
      #   빈 행만 채우므로 평시엔 몇 초. 파수꾼(NVDA·AAPL…)이 비면 여기서 실패한다.
      - name: 시총 결측 복구
        if: steps.due.outputs.skip != 'true'
        run: python leaders_build.py fixcap

      - name: 이익 가속 신호 발행
        id: publish
        if: steps.due.outputs.skip != 'true'
        run: python leaders_accel.py

      # 2026-10-14 신설 — 09-26·10-03 실행은 universe **2종**, 10-10 새벽은 242종으로
      #   leaders_accel.json 을 덮어썼다(정상 945종). 낡은 DB 로 '성공'하고 화면을
      #   망가뜨린 것이다. 직전 커밋본보다 30% 넘게 줄었거나 1,000종 미만이면
      #   새 결과를 버리고 이전 것을 되살린 뒤 **잡을 실패시킨다** — 뒤 단계
      #   (후보 산출·커밋)는 전부 건너뛴다. 아래 실패 알림이 텔레그램으로 간다.
      - name: 유니버스 붕괴 차단
        if: steps.due.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json, subprocess, sys
          new = json.load(open("results/leaders_accel.json", encoding="utf-8")).get("universe") or 0
          try:
              old = json.loads(subprocess.check_output(
                  ["git", "show", "HEAD:results/leaders_accel.json"])).get("universe") or 0
          except Exception:
              old = 0
          print(f"universe 직전 {old:,} → 이번 {new:,}")
          if new < 1000 and (old == 0 or new < old * 0.7):
              subprocess.call(["git", "checkout", "HEAD", "--", "results/leaders_accel.json"])
              print(f"::error::이익가속 유니버스 붕괴({old:,}→{new:,}) — 발행을 취소하고 이전 결과를 유지한다")
              sys.exit(1)
          PY

      # 2026-10-14 — price_curves.json 은 PC 스케줄러(leaders_weekly.sh)에서만 만들어져
      #   PC 가 꺼진 주마다 멈췄다(10-13 기준 13일 정지). spans 를 읽으므로 발행 뒤에 둔다.
      - name: 가격 곡선 발행
        if: steps.due.outputs.skip != 'true'
        run: python curves_build.py
        continue-on-error: true

      # 2026-10-14 — 🔄흑자전환은 PC 수동 실행(run_update.bat)뿐이었다. US 는 이 잡이
      #   방금 갱신한 fq_(EDGAR 분기재무)를, KR 은 레포의 kr_fundamentals_q.parquet 를
      #   읽으므로 러너에서 그대로 돈다.
      - name: 흑자전환 스크리너
        if: steps.due.outputs.skip != 'true'
        run: python turnaround_run.py
        continue-on-error: true

      # 편입 후보를 CSV 로 떨군다. DB가 12일 넘게 낡으면 exit 2 로 죽는다 —
      # 죽어야 알아챈다. exclude.txt 가 있으면 그 티커는 건너뛴다(없어도 된다).
      - name: 편입 후보 산출
        if: steps.due.outputs.skip != 'true'
        run: |
          cat > _accel_export.py <<'PYEOF'
          import json, os, sys
          import pandas as pd
          import leaders_accel as A

          STALE_DAYS = 12
          BASE = os.path.dirname(os.path.abspath(__file__))

          def load_exclude():
              p = os.path.join(BASE, "exclude.txt")
              if not os.path.exists(p):
                  return set()
              out = set()
              for line in open(p, encoding="utf-8"):
                  t = line.split("#")[0].strip().upper()
                  if t:
                      out.add(t)
              return out

          d = A.load()
          d["as_of"] = pd.to_datetime(d["as_of"])
          gate = ((d.ACC == 1) & (d.ret_1w >= A.SURGE)
                  & (d.adv_20d >= A.MIN_ADV) & (d.marcap >= A.MIN_MC))
          sig = d[gate].copy()

          last = d.as_of.max()
          age = (pd.Timestamp.utcnow().tz_localize(None) - last).days
          ex = load_exclude()

          s = sig[sig.as_of == last].copy()
          s["excluded"] = s.sym.isin(ex)
          picks = s[~s.excluded].sort_values("marcap")

          cols = [c for c in ["sym", "name", "close", "marcap", "adv_20d", "ret_1w",
                              "dist_52w", "op_income", "rev_yoy", "oi_a", "rv_a"]
                  if c in picks.columns]
          out = picks[cols].copy()
          out.insert(0, "rank", range(1, len(out) + 1))
          out.insert(1, "as_of", last.date())

          os.makedirs("exports", exist_ok=True)
          os.makedirs("results", exist_ok=True)
          out.to_csv("exports/accel_picks.csv", index=False, encoding="utf-8-sig")
          out.to_csv(f"exports/accel_picks_{last.date()}.csv",
                     index=False, encoding="utf-8-sig")

          status = {
              "factor_ver": A.VER,
              "db_latest_week": str(last.date()),
              "exported_week": str(last.date()),
              "age_days": age,
              "stale": age > STALE_DAYS,
              "signals": int(len(s)),
              "excluded": int(s.excluded.sum()),
              "picks": int(len(out)),
              "generated_at": pd.Timestamp.utcnow().strftime("%Y-%m-%d %H:%M UTC"),
          }
          json.dump(status, open("results/accel_picks_status.json", "w",
                                 encoding="utf-8"), ensure_ascii=False, indent=2)

          print(f"FACTOR_VER={A.VER} / DB 최신 주차 {last.date()} (경과 {age}일)")
          print(f"신호 {len(s)}종 / 제외 {int(s.excluded.sum())}종 / 후보 {len(out)}종")
          if len(out):
              v = out.copy()
              v["marcap"] = (v.marcap / 1e6).round(0)
              v["adv_20d"] = (v.adv_20d / 1e6).round(1)
              if "op_income" in v:
                  v["op_income"] = (v.op_income / 1e6).round(1)
              print()
              print(v.head(12).to_string(index=False))
          if status["stale"]:
              print(f"[STALE] DB가 {age}일 낡았습니다 (기준 {STALE_DAYS}일).",
                    file=sys.stderr)
              sys.exit(2)
          PYEOF
          python _accel_export.py
          rm -f _accel_export.py

      # 2026-10-14 — 산출물 계약(output_contracts.py). 내용이 무너진 산출물은 커밋하지 않고
      #   직전 정상본으로 되돌린다. 날짜만 신선하고 내용이 죽은 고장(KR 0종·universe 2종·
      #   순이익 공란 parquet)을 화면에 내보내지 않기 위해서다. 여기서는 실패시키지 않는다 —
      #   정상인 나머지 산출물은 커밋돼야 하므로. 실패 처리는 커밋 뒤 단계에서 한다.
      - name: 산출물 계약 검사 (위반분 되돌림)
        if: steps.due.outputs.skip != 'true'
        run: python output_contracts.py --guard
        continue-on-error: true

      - name: 결과 커밋 & 푸시
        if: steps.due.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          for f in exports/accel_picks.csv results/accel_picks_status.json results/leaders_accel.json results/price_curves.json results/turnaround_latest.json; do
            [ -f "$f" ] && git add -f "$f"
          done
          git add -f exports/accel_picks_*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: 주도주 편입 후보 $(date -u +%Y-%m-%d)"
            # 2026-10-19 — 실행 중 다른 커밋이 먼저 들어가 push 가 거절됐다(exit 128). 계산은 끝났는데
            #   결과만 버려졌다. 받아서 다시 올리기를 3번까지 한다.
            for i in 1 2 3; do
              git push origin main && break
              echo "push 거절 — 재시도 $i"
              git pull --rebase origin main || { git rebase --abort; git pull --rebase -X theirs origin main; }
              sleep 5
            done
            git log origin/main..HEAD --oneline | grep -q . && { echo "::error::결과 push 3회 실패"; exit 1; } || true
          fi

      # 계약 위반으로 잡이 실패해도 갱신된 DB·캐시는 남긴다(위 ⚠️ 참조).
      # 단, 이익 가속 신호 발행까지 성공했을 때만 — 반쯤 쓴 DB 를 저장하지 않게.
      - name: market.db 저장
        if: always() && steps.due.outputs.skip != 'true' && steps.publish.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/market.db
          key: marketdb-${{ github.run_id }}

      - name: 주봉 가격·재무 캐시 저장
        if: always() && steps.due.outputs.skip != 'true' && steps.publish.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/leaders_cache
          key: leaders-cache-${{ github.run_id }}

      - name: 산출물 계약 위반 보고 (위반 시 실패)
        if: steps.due.outputs.skip != 'true'
        run: python output_contracts.py --fail-if-violated

      - name: 실패 시 텔레그램
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/notify_ci_failure.py
        continue-on-error: true

      - name: 산출물 요약
        if: always()
        run: |
          if [ -f results/accel_picks_status.json ]; then
            cat results/accel_picks_status.json
          fi
          if [ -f exports/accel_picks.csv ]; then
            echo "--- 편입 후보 (상위 10) ---"
            head -11 exports/accel_picks.csv
          fi
