# 한국 돈의 흐름(외국인 순매수 · 신용잔고 · 고객예탁금) — 매크로 탭 '🇰🇷 한국' 블록 (2026-11-06)
#   tools/kr_flow.py → results/kr_flow.json. 한국 장 마감 뒤(신용잔고는 하루 늦게 나온다).
name: kr-flow
on:
  workflow_dispatch:
  schedule:
    - cron: '47 8 * * 1-5'      # 월~금 17:47 KST
permissions:
  contents: write
jobs:
  kr-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pandas requests lxml beautifulsoup4 html5lib
      - name: 수집
        run: python tools/kr_flow.py
      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add results/kr_flow.json
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "auto: 한국 수급 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase --autostash -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1

      # 2026-11-22 감시 커버리지 — 이 산출물에는 CI 감시자가 없었다(화면엔 빨간불, CI 는 초록불).
      #   `tools/check_freshness_ci.py --audit` 가 공백을 세며, 새 산출물을 등록하면 거기서 걸린다.
      - name: 산출물 신선도 검증
        if: always()
        run: python tools/check_freshness_ci.py --job kr-flow
