# 한국 돈의 흐름(외국인 순매수 · 신용잔고 · 고객예탁금) — 매크로 탭 '🇰🇷 한국' 블록 (2026-11-06)
#   tools/kr_flow.py → results/kr_flow.json. 한국 장 마감 뒤(신용잔고는 하루 늦게 나온다).
name: kr-flow
on:
  workflow_dispatch:
    inputs:
      probe:
        description: '수집 경로 진단만'
        type: boolean
        default: false
  schedule:
    - cron: '47 8 * * 1-5'      # 월~금 17:47 KST
permissions:
  contents: write
jobs:
  kr-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install pandas requests lxml beautifulsoup4 html5lib pykrx
      - name: 진단
        if: ${{ inputs.probe }}
        run: python tools/kr_flow_probe.py
      - name: 수집
        if: ${{ !inputs.probe }}
        run: python tools/kr_flow.py
      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add results/kr_flow.json
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "auto: 한국 수급 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
