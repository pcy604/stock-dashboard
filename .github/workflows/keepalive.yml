# 배포 앱 깨우기 (2026-10-21) — 지인 베타 '첫 접속이 느리다' 대응. 한국 시간 낮 동안 3시간마다.
name: keepalive
on:
  workflow_dispatch:
  schedule:
    - cron: '7 22,1,4,7,10,13 * * *'      # UTC → KST 07·10·13·16·19·22시
permissions:
  contents: write   # 2026-10-23 실화면 점검 결과를 app-health 브랜치로
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      # 2026-10-23: 깨우기 + 메인 탭 5개·?sym=TSLA·005930 실화면 예외 점검(하나라도 깨지면 빨간불)
      - name: 깨우기 + 실화면 점검
        id: health
        run: python tools/keepalive.py
      - name: 점검 결과를 app-health 브랜치로 (Actions 로그 없이도 확인 가능)
        if: always()
        run: |
          [ -f results/app_health.json ] || exit 0
          cp results/app_health.json /tmp/app_health.json
          rm -f results/app_health.json   # 추적 안 된 같은 경로 파일이 있으면 브랜치 전환이 거부된다(10-24 푸시 실패 원인)
          git config user.name github-actions; git config user.email actions@github.com
          git fetch -q origin app-health:refs/remotes/origin/app-health && git checkout -q -B app-health origin/app-health || git checkout -q --orphan app-health   # 얕은 checkout 은 refspec 이 main 뿐이라 명시해야 함(10-23 첫 회 뒤 푸시 거부 → || true 에 묻힘)
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p results && cp /tmp/app_health.json results/app_health.json
          git add -f results/app_health.json
          git commit -qm "app-health $(date -u +%FT%TZ)" && git push -q origin app-health
      - name: 실패 시 텔레그램
        if: failure() && steps.health.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" -d chat_id="$TELEGRAM_CHAT_ID" \
            --data-urlencode text="🔴 대시보드 실화면 점검 실패 — 결과: https://github.com/${{ github.repository }}/blob/app-health/results/app_health.json" >/dev/null
